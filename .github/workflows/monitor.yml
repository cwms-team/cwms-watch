name: CWMS 監控

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['config/watchlist.json', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: cwms-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 檢查五縣市 CWMS 公開資料
        run: node scripts/check.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DELAY_MINUTES: '180'

      - name: 儲存結果
        run: |
          git config user.name  "cwms-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "沒有變更"
          else
            git commit -m "data: $(TZ=Asia/Taipei date '+%m/%d %H:%M') 監控結果"
            git pull --rebase --autostash
            git push
          fi
