name: CWMS 監控

# 雲端（GitHub 主機）：台中、雲林、苗栗、南投
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['config/watchlist.json', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: cwms-monitor-cloud
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RUN_NAME: cloud
      ONLY_REGIONS: taichung,yunlin,miaoli,nantou
      DELAY_MINUTES: '180'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 檢查 CWMS 公開資料
        run: node scripts/check.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: 儲存結果
        run: node scripts/commit.mjs
